media:
  input: assets/galerija
  output: assets/galerija
  rename: safe
  extensions: [jpg, jpeg, png, webp]

content:
  - name: galerija
    label: Galerija
    type: file
    path: data/gallery.json
    format: json
    list: true
    fields:
      - name: image
        label: Nuotrauka
        type: image
        required: true
      - name: caption
        label: Aprašymas
        type: string
      - name: category
        label: Kategorija
        type: select
        values: [Treniruotės, Varžybos, Stovyklos, Renginiai, Laisvalaikis]
